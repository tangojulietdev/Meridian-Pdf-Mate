<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meridian PDF">
<title>Meridian PDF Mate</title>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>(function(){try{var t=localStorage.getItem('pdfmate.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
/* Layout: macOS document window. Glass toolbar on top, glass page sidebar left, document canvas centre,
   format bar under the toolbar. On phones the tool strip becomes a floating glass dock at the bottom. */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --win: #f5f5f7;
  --canvas: #e4e4e9;
  --glass: rgba(250,250,252,.72);
  --glass-strong: rgba(255,255,255,.86);
  --glass-edge: rgba(255,255,255,.75);
  --sidebar: rgba(240,240,244,.70);
  --label: #1d1d1f;
  --label-2: #48484d;
  --label-3: #6e6e73;
  --sep: rgba(0,0,0,.10);
  --sep-strong: rgba(0,0,0,.16);
  --fill: rgba(0,0,0,.05);
  --fill-2: rgba(0,0,0,.08);
  --fill-hover: rgba(0,0,0,.07);
  --control: #ffffff;
  --accent: #007aff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(0,122,255,.12);
  --danger: #d70015;
  --danger-soft: rgba(215,0,21,.10);
  --ok: #248a3d;
  --page-shadow: 0 1px 2px rgba(0,0,0,.10), 0 8px 24px rgba(0,0,0,.10);
  --pop-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 10px 30px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.08);
  --ctrl-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.10);
  --scrim: rgba(0,0,0,.28);
  --r-win: 16px; --r: 12px; --r-sm: 8px;
  --ease: cubic-bezier(.2,.8,.2,1);
  --tb-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --win:#1c1c1e; --canvas:#111113; --glass:rgba(44,44,48,.66); --glass-strong:rgba(50,50,54,.88); --glass-edge:rgba(255,255,255,.10);
  --sidebar:rgba(36,36,40,.66); --label:#f5f5f7; --label-2:#d1d1d6; --label-3:#a1a1a6; --sep:rgba(255,255,255,.10); --sep-strong:rgba(255,255,255,.16);
  --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.11); --fill-hover:rgba(255,255,255,.10); --control:#636366;
  --accent:#0a84ff; --accent-ink:#ffffff; --accent-soft:rgba(10,132,255,.22); --danger:#ff453a; --danger-soft:rgba(255,69,58,.16); --ok:#30d158;
  --page-shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  --pop-shadow:0 0 0 .5px rgba(255,255,255,.12), 0 14px 36px rgba(0,0,0,.55);
  --ctrl-shadow:0 0 0 .5px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.5); color-scheme:dark; }}
:root[data-theme="dark"]{
  --win:#1c1c1e; --canvas:#111113; --glass:rgba(44,44,48,.66); --glass-strong:rgba(50,50,54,.88); --glass-edge:rgba(255,255,255,.10);
  --sidebar:rgba(36,36,40,.66); --label:#f5f5f7; --label-2:#d1d1d6; --label-3:#a1a1a6; --sep:rgba(255,255,255,.10); --sep-strong:rgba(255,255,255,.16);
  --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.11); --fill-hover:rgba(255,255,255,.10); --control:#636366;
  --accent:#0a84ff; --accent-ink:#ffffff; --accent-soft:rgba(10,132,255,.22); --danger:#ff453a; --danger-soft:rgba(255,69,58,.16); --ok:#30d158;
  --page-shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  --pop-shadow:0 0 0 .5px rgba(255,255,255,.12), 0 14px 36px rgba(0,0,0,.55);
  --ctrl-shadow:0 0 0 .5px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.5); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--win);color:var(--label);font-family:var(--font);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}

.app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}

/* Toolbar: three columns, tools centred in the window, controls as glass pills */
:root{--pill:rgba(255,255,255,.78);--pill-shadow:0 0 0 .5px rgba(0,0,0,.09),0 1px 2px rgba(0,0,0,.07);--pill-on:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pill:rgba(255,255,255,.075);--pill-shadow:inset 0 .5px 0 rgba(255,255,255,.12),0 0 0 .5px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--pill:rgba(255,255,255,.075);--pill-shadow:inset 0 .5px 0 rgba(255,255,255,.12),0 0 0 .5px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.35)}
.toolbar{position:relative;z-index:30;height:var(--tb-h);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:14px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));border-bottom:.5px solid var(--sep-strong)}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0;justify-self:stretch}
.tb-right{display:flex;align-items:center;gap:8px;justify-self:end;min-width:0}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:32px;height:30px;padding:0 8px;border:0;border-radius:999px;background:transparent;color:var(--label-2);transition:background-color .15s var(--ease),color .15s,transform .1s}
.tbtn svg.i{width:17px;height:17px}
.tbtn:hover{background:var(--fill-hover);color:var(--label)}
.tbtn:active{transform:scale(.95)}
.tbtn[disabled]{opacity:.32;pointer-events:none}
.tbtn[aria-pressed="true"]{background:var(--fill-2);color:var(--label)}
.tbtn.solo{height:34px;min-width:34px;padding:0;background:var(--pill);box-shadow:var(--pill-shadow)}
.tbtn.solo[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tbtn.primary{height:34px;background:var(--accent);color:var(--accent-ink);padding:0 16px 0 13px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15),inset 0 .5px 0 rgba(255,255,255,.25)}
.tbtn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000);color:var(--accent-ink)}
.tbtn.primary[disabled]{opacity:.45}
.pill,.capsule{display:inline-flex;align-items:center;gap:0;height:34px;padding:2px;border-radius:999px;background:var(--pill);box-shadow:var(--pill-shadow);flex:none}
.pill .tbtn,.capsule .tbtn{height:30px;min-width:32px;padding:0 7px}
.docname{display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.15}
.docname input{border:0;background:transparent;font-weight:650;font-size:14px;letter-spacing:-.01em;color:var(--label);padding:2px 6px;margin-left:-6px;border-radius:6px;min-width:0;width:100%;max-width:260px;text-overflow:ellipsis}
.docname input:hover{background:var(--fill)}
.docname input:focus{background:var(--control);box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent);outline:none}
.docname small{font-size:11px;color:var(--label-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoomlbl{min-width:50px;height:30px;text-align:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--label-2);border:0;background:transparent;border-radius:999px}
.zoomlbl:hover{background:var(--fill-hover);color:var(--label)}

/* Tools: separate glass pills per family */
.tools{display:flex;align-items:center;gap:8px;flex:none}
.tgroup{display:inline-flex;align-items:center;height:34px;padding:2px;gap:0;border-radius:999px;background:var(--pill);box-shadow:var(--pill-shadow)}
.tool{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:1px;width:34px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--label-2);transition:background-color .15s var(--ease),color .15s}
.tool svg.i{width:17px;height:17px}
.tool:hover{color:var(--label);background:var(--fill-hover)}
.tool[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.16),inset 0 .5px 0 rgba(255,255,255,.22)}
.tool.grp{width:auto;padding:0 6px 0 9px}
.tool.grp .chev{width:9px;height:9px;stroke-width:2.4;opacity:.6;margin-left:1px}
.tool .tip{display:none}
.tsep{display:none}

/* Format bar */
.stage{position:relative;flex:1;min-width:0;display:flex}
.formatbar{position:absolute;z-index:25;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;flex-wrap:nowrap;white-space:nowrap;
  min-height:44px;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;padding:5px 8px 5px 16px;border-radius:999px;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--pop-shadow);border:.5px solid var(--glass-edge);animation:fbin .2s var(--ease)}
.formatbar::-webkit-scrollbar{display:none}
@keyframes fbin{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
.fb-label{font-size:12px;font-weight:600;color:var(--label-3)}
.swatches{display:flex;gap:6px}
.sw{width:22px;height:22px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);position:relative}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 2px var(--accent)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--fill);border-radius:999px;padding:2px;box-shadow:inset 0 0 0 .5px var(--sep)}
.stepper button{width:28px;height:26px;border:0;border-radius:999px;background:transparent;color:var(--label-2);font-size:16px;line-height:1}
.stepper button:hover{background:var(--fill-hover)}
.stepper output{min-width:42px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px;font-weight:600}
.fb-spacer{flex:0 0 2px}
.fb-hint{font-size:12px;color:var(--label-3)}

/* Body */
.body{position:relative;flex:1;display:flex;min-height:0}
.sidebar{width:220px;flex:none;display:flex;flex-direction:column;border-right:.5px solid var(--sep-strong);background:var(--sidebar);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  transition:margin-left .25s var(--ease);z-index:20}
.app.no-sidebar .sidebar{margin-left:-220px}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px 16px}
.sb-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--label-3)}
.sb-list{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.thumb{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:6px;border-radius:10px;color:var(--label-2);position:relative}
.thumb:hover{background:var(--fill)}
.thumb .tw{position:relative;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.12);border-radius:3px;overflow:hidden;line-height:0}
.thumb canvas{display:block;max-width:150px;max-height:200px}
.thumb .tn{font-size:11px;font-variant-numeric:tabular-nums;padding:1px 8px;border-radius:999px}
.thumb.current .tw{box-shadow:0 0 0 3px var(--accent),0 2px 6px rgba(0,0,0,.12)}
.thumb.current .tn{background:var(--accent);color:var(--accent-ink);font-weight:600}
.thumb.sel{background:var(--accent-soft)}
.thumb .chk{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--glass-strong);box-shadow:inset 0 0 0 1.5px var(--sep-strong);display:none;align-items:center;justify-content:center;color:#fff}
.sidebar.selecting .thumb .chk{display:flex}
.thumb.sel .chk{background:var(--accent);box-shadow:none}
.thumb.drop-before::before{content:"";position:absolute;left:10px;right:10px;top:-8px;height:3px;border-radius:2px;background:var(--accent)}
.sb-foot{display:flex;align-items:center;justify-content:space-between;gap:2px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:.5px solid var(--sep)}
.sb-foot .tbtn{min-width:28px;height:30px;padding:0 4px}

.viewer{position:relative;flex:1;min-width:0;overflow:auto;background:var(--canvas);overscroll-behavior:contain}
.pages{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:72px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));min-width:min-content}
.page{position:relative;background:#fff;box-shadow:var(--page-shadow);flex:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%}
.page svg.ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:pan-x pan-y pinch-zoom}
.viewer.drawing .page svg.ov{touch-action:none;cursor:crosshair}
.viewer.drawing[data-tool="text"] .page svg.ov{cursor:text}
.page .pnum{position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);font-size:11px;color:var(--label-3);font-variant-numeric:tabular-nums}
.ann{cursor:move;touch-action:none}
.viewer.drawing .ann{cursor:inherit}
.selbox{fill:none;stroke:var(--accent);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:4 3;pointer-events:none}
.handle-hit{fill:transparent;stroke:none;cursor:nwse-resize;touch-action:none}
.handle{fill:#fff;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:nwse-resize;touch-action:none}
.pageind{border:0;cursor:pointer;pointer-events:auto!important;position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--label-2);box-shadow:var(--pop-shadow);pointer-events:none}
.textedit{position:absolute;z-index:12;margin:0;padding:0;border:0;outline:1.5px solid var(--accent);outline-offset:2px;border-radius:2px;background:rgba(255,255,255,.85);resize:none;overflow:hidden;font-family:Helvetica,Arial,"Liberation Sans",sans-serif;line-height:1.2;white-space:pre;color:#000}

.ff{position:absolute;margin:0;border:0;border-radius:2px;padding:0 3px;background:rgba(0,122,255,.11);box-shadow:inset 0 0 0 1px rgba(0,122,255,.30);color:#000;font-family:Helvetica,Arial,"Liberation Sans",sans-serif;line-height:1.15;resize:none;transition:box-shadow .15s,background-color .15s;color-scheme:light}
.ff:hover{background:rgba(0,122,255,.17)}
.ff:focus{outline:none;background:rgba(255,255,255,.96);box-shadow:0 0 0 2px var(--accent),0 2px 8px rgba(0,0,0,.15)}
.ff:disabled{background:transparent;box-shadow:none}
button.ff{display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
button.ff svg.i{width:85%;height:85%;stroke-width:2.6;color:#000}
textarea.ff{padding-top:2px;white-space:pre-wrap}
select.ff{padding:0 2px;appearance:auto}

/* Text layer (from pdf.js viewer), find, selection bubble, hand */
.page{--scale-round-x:1px;--scale-round-y:1px;--user-unit:1}
.textLayer{color-scheme:only light;position:absolute;text-align:initial;inset:0;overflow:clip;opacity:1;line-height:1;letter-spacing:normal;word-spacing:normal;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;caret-color:CanvasText;z-index:1;
  --min-font-size:1;--text-scale-factor:calc(var(--total-scale-factor) * var(--min-font-size));--min-font-size-inv:calc(1 / var(--min-font-size))}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%;-webkit-user-select:text;user-select:text}
.textLayer > :not(.markedContent),.textLayer .markedContent span:not(.markedContent){z-index:1;--font-height:0;font-size:calc(var(--text-scale-factor) * var(--font-height));--scale-x:1;--rotate:0deg;transform:rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv))}
.textLayer .markedContent{display:contents}
.textLayer span[role="img"]{user-select:none;cursor:default}
.textLayer ::selection{background:rgba(0,122,255,.28);color:transparent}
.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:0;cursor:default;user-select:none}
.textLayer.selecting .endOfContent{top:0}
[data-main-rotation="90"]{transform:rotate(90deg) translateY(-100%)}
[data-main-rotation="180"]{transform:rotate(180deg) translate(-100%,-100%)}
[data-main-rotation="270"]{transform:rotate(270deg) translateX(-100%)}
.viewer[data-tool="edittext"] .textLayer span{cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:2px}
.viewer[data-tool="edittext"] .textLayer span:hover{background:rgba(0,122,255,.14);box-shadow:0 0 0 1px rgba(0,122,255,.55)}
.findlayer{position:absolute;inset:0;z-index:2;pointer-events:none}
.findlayer i{position:absolute;border-radius:2px;background:rgba(255,204,0,.45);mix-blend-mode:multiply}
.findlayer i.cur{background:rgba(255,149,0,.75);box-shadow:0 0 0 2px rgba(255,149,0,.9)}
.formlayer{z-index:3}
.page svg.ov{z-index:4}
.viewer:not(.drawing) .page svg.ov{pointer-events:none}
.viewer:not(.drawing) .page svg.ov .ann,.viewer:not(.drawing) .page svg.ov .handle,.viewer:not(.drawing) .page svg.ov .handle-hit{pointer-events:all}
.viewer.drawing .textLayer{pointer-events:none;user-select:none}
.viewer[data-tool="hand"],.viewer.spacepan{cursor:grab}
.viewer[data-tool="hand"] .page *,.viewer.spacepan .page *{pointer-events:none!important;user-select:none!important;cursor:grab!important}
.viewer.panning,.viewer.panning .page *{cursor:grabbing!important}
.viewer[data-tool="hand"] .pages{user-select:none}
.msw{width:16px;height:16px;border-radius:4px;flex:none;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.menu button:hover .msw,.menu button:focus-visible .msw{border-color:#fff}
.findbar{position:absolute;z-index:26;top:12px;right:max(14px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:4px;padding:4px 6px 4px 12px;border-radius:999px;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--pop-shadow);border:.5px solid var(--glass-edge);animation:fbin2 .18s var(--ease)}
@keyframes fbin2{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.findbar input{border:0;background:transparent;outline:none;width:200px;max-width:42vw;height:30px;font-size:14px;color:var(--label)}
.findbar .fcount{font-size:12px;color:var(--label-3);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;white-space:nowrap}
.findbar .tbtn{min-width:30px;height:30px;padding:0 6px}
.bubble{position:fixed;z-index:65;display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--pop-shadow);border:.5px solid var(--glass-edge);animation:pop .14s var(--ease)}
.bubble button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--label);font-weight:600;font-size:13px}
.bubble button:hover{background:var(--fill-2)}

<div class="app no-sidebar" id="app">
  <header class="toolbar glass">
    <div class="tb-left">
      <button class="tbtn solo" id="btnSidebar" aria-label="Show page sidebar" aria-pressed="false" title="Sidebar"></button>
      <div class="docname">
        <input id="docName" value="Untitled" aria-label="File name" spellcheck="false" autocomplete="off">
        <small id="docMeta">No document</small>
      </div>
    </div>
    <div class="tools" id="tools" role="toolbar" aria-label="Markup tools"></div>
    <div class="tb-right">
      <div class="pill tb-zoom" role="group" aria-label="Zoom">
        <button class="tbtn" id="zoomOut" aria-label="Zoom out" title="Zoom out (Ctrl -)"></button>
        <button class="zoomlbl" id="zoomLbl" title="Fit to width (Ctrl 0)">100%</button>
        <button class="tbtn" id="zoomIn" aria-label="Zoom in" title="Zoom in (Ctrl +)"></button>
      </div>
      <div class="pill" role="group" aria-label="Undo and redo">
        <button class="tbtn" id="btnUndo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled></button>
        <button class="tbtn tb-redo" id="btnRedo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled></button>
      </div>
      <div class="pill" role="group" aria-label="File">
        <button class="tbtn" id="btnOpen" aria-label="Open or add files" title="Open or add files (Ctrl+O)"></button>
        <button class="tbtn tb-print" id="btnPrint" aria-label="Print" title="Print (Ctrl+P)" disabled></button>
        <button class="tbtn" id="btnInstall" aria-label="Install app" title="Install Meridian PDF Mate" hidden></button>
        <button class="tbtn" id="btnMore" aria-label="More" title="More" aria-haspopup="menu"></button>
      </div>
      <button class="tbtn primary" id="btnSave" disabled><span id="saveIc"></span><span class="tb-hide-m">Save</span></button>
    </div>
  </header>
  <div class="tabbar" id="tabbar" hidden>
    <div class="tab-list" id="tabList" role="tablist" aria-label="Open documents"></div>
    <button class="tbtn tab-new" id="tabNew" aria-label="Open a PDF in a new tab" title="Open in new tab (Ctrl+O)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>  <div class="body">
    <aside class="sidebar" id="sidebar" aria-label="Pages">
      <div class="sb-seg"><div class="seg" id="sbSeg" role="group" aria-label="Sidebar view"><button data-v="pages" aria-pressed="true">Pages</button><button data-v="outline" aria-pressed="false">Bookmarks</button></div></div>
      <div class="sb-head"><span class="sb-title" id="sbTitle">Pages</span><button class="tbtn" id="btnSelPages" style="height:26px;font-size:12px;font-weight:600">Select</button></div>
      <div class="sb-list" id="sbList"></div>
      <div class="ol-list" id="olList" hidden></div>
      <div class="sb-foot" id="sbFoot">
        <button class="tbtn" data-pa="rotl" aria-label="Rotate left" title="Rotate left"></button>
        <button class="tbtn" data-pa="rotr" aria-label="Rotate right" title="Rotate right"></button>
        <button class="tbtn" data-pa="up" aria-label="Move up" title="Move up"></button>
        <button class="tbtn" data-pa="down" aria-label="Move down" title="Move down"></button>
        <button class="tbtn" data-pa="dup" aria-label="Duplicate page" title="Duplicate page"></button>
        <button class="tbtn" data-pa="blank" aria-label="Insert blank page after" title="Insert blank page"></button>
        <button class="tbtn" data-pa="del" aria-label="Delete page" title="Delete page" style="color:var(--danger)"></button>
      </div>
    </aside>
    <div class="stage">
    <div class="formatbar" id="formatBar" role="toolbar" aria-label="Format" hidden></div>
    <main class="viewer" id="viewer" tabindex="-1">
      <div class="pages" id="pages"></div>
      <div class="empty" id="empty">
        <div class="empty-card">
          <div class="empty-ic" id="emptyIc"></div>
          <div class="brandline">Meridian PDF Mate</div>
          <h1>Open a PDF to get started</h1>
          <p>Fill, sign, stamp and mark up documents. Merge, reorder and rotate pages. Everything stays on this device.</p>
          <div class="acts">
            <button class="btn primary" id="eOpen">Choose PDF</button>
            <button class="btn" id="ePhotos">Photos to PDF</button>
            <button class="btn" id="eScan">Scan</button>
            <button class="btn" id="eBlank">Blank page</button>
          </div>
          <div class="feat" id="feat"></div>
          <button class="btn" id="eInstall" style="margin-top:18px" hidden>Install app</button>
          <div class="recents" id="recents" hidden></div>
        </div>
      </div>
    </main>
    <button class="pageind glass" id="pageInd" title="Go to page (Ctrl+G)" hidden>1 / 1</button>
    </div>
  </div>
</div>
<input type="file" id="fileOpen" accept="application/pdf,.pdf,image/*" multiple hidden>
<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileStamp" accept="image/*" hidden>
<input type="file" id="fileInsertImg" accept="image/*" hidden>
<input type="file" id="fileScan" accept="image/*" capture="environment" hidden>
<input type="file" id="fileCmp" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileAdd" accept="application/pdf,.pdf,image/*" multiple hidden>
<div id="layer"></div>
<script src="vendor/pdf-lib.min.js"></script>
<script type="module" src="app.js?v=13"></script>
</body>
</html>
